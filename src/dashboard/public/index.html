<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agent-mesh</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
<style>
  :root {
    --bg:#0b0b0c; --panel:#101012; --panel-2:#0e0e10; --line:#232326;
    --ink:#f4f4f2; --ink-2:#9b9b98; --ink-3:#5c5c58;
    --accent:#4d8dfa; --accent-ink:#0b0b0c;
    --ok:#3ecf8e; --warn:#f5b02e; --bad:#f2555a;
    --mono:'SF Mono','Menlo','Cascadia Code','Fira Code',ui-monospace,monospace;
    --disp:'Helvetica Neue','Neue Haas Grotesk',-apple-system,'Segoe UI',sans-serif;
  }
  [data-theme="light"] {
    --bg:#f2f1ed; --panel:#faf9f6; --panel-2:#f6f5f1; --line:#d8d6cf;
    --ink:#121210; --ink-2:#5d5d58; --ink-3:#a3a29b;
    --accent:#2f6ee0; --accent-ink:#ffffff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); font-family:var(--mono);
    font-size:13px; line-height:1.5; overflow-x:hidden;
    transition:background .25s,color .25s;
  }
  ::selection { background:var(--accent); color:var(--accent-ink); }

  /* ── Left rail ─────────────────────────────────────────── */
  .rail {
    position:fixed; top:0; left:0; bottom:0; width:64px; z-index:50;
    border-right:1px solid var(--line); background:var(--bg);
    display:flex; flex-direction:column; align-items:center; padding:18px 0;
  }
  .rail-mark { width:14px; height:14px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .rail-brand {
    flex:1; display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl; transform:rotate(180deg);
    font-size:10px; letter-spacing:.35em; color:var(--ink-3); text-transform:uppercase;
    user-select:none; white-space:nowrap;
  }
  .rail-brand b { color:var(--ink-2); font-weight:400; }
  .rail-brand b:hover { color:var(--ink); }

  /* ── Layout ────────────────────────────────────────────── */
  .shell { margin-left:64px; min-height:100vh; border-right:1px solid var(--line); max-width:1520px; }
  .panel { border-bottom:1px solid var(--line); }
  .label {
    font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-3);
  }

  /* ── Hero ──────────────────────────────────────────────── */
  .hero { padding:56px 56px 44px; position:relative; }
  .hero .label { margin-bottom:26px; }
  .hero h1 {
    font-family:var(--disp); font-weight:700; letter-spacing:-.025em;
    font-size:clamp(34px,4.6vw,64px); line-height:1.04; max-width:14em;
    text-wrap:balance;
  }
  .hero-actions {
    position:absolute; right:56px; top:50%; transform:translateY(-50%);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end;
  }
  .hero-btn {
    background:transparent; border:1px solid var(--line); color:var(--ink-2);
    font-family:var(--mono); font-size:11px; letter-spacing:.1em; cursor:pointer;
    padding:12px 18px; display:flex; align-items:center; gap:10px;
    transition:border-color .15s, color .15s; white-space:nowrap;
  }
  .hero-btn:hover { border-color:var(--ink-2); color:var(--ink); }
  .hero-btn .glyph { font-size:12px; line-height:1; }
  .hero-btn.on { border-color:var(--accent); color:var(--accent); }
  .live-chip {
    background:var(--accent); color:var(--accent-ink); border:none; cursor:default;
    font-family:var(--mono); font-size:11px; letter-spacing:.1em;
    padding:12px 20px; display:flex; align-items:center; gap:10px;
  }
  .live-dot { width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

  /* ── Stats ─────────────────────────────────────────────── */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); }
  .stat { padding:30px 40px 26px; border-right:1px solid var(--line); }
  .stat:last-child { border-right:none; }
  .stat .label { margin-bottom:14px; }
  .stat-num {
    font-family:var(--disp); font-weight:700; font-size:clamp(40px,4vw,58px);
    letter-spacing:-.02em; line-height:1; color:var(--ink-3); font-variant-numeric:tabular-nums;
  }
  .stat-rule { height:2px; background:var(--line); margin-top:18px; transition:background .3s; }
  .stat.hot .stat-num { color:var(--accent); }
  .stat.hot .stat-rule { background:var(--accent); }
  .stat.lit .stat-num { color:var(--ink); }
  .stat.lit .stat-rule { background:var(--ink); }

  /* ── Metrics strip ─────────────────────────────────────── */
  .metrics { display:grid; grid-template-columns:1fr 1fr 1fr; }
  .metric {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 40px; border-right:1px solid var(--line); gap:16px; min-width:0;
  }
  .metric:last-child { border-right:none; }
  .metric b { font-weight:400; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ── Asks in progress ──────────────────────────────────── */
  #asks-section { display:none; }
  .ask-row {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 40px; border-top:1px solid var(--line); font-size:12px;
  }
  .ask-row:first-of-type { border-top:none; }
  .ask-row .arrow { color:var(--ink-3); }
  .ask-row .who { color:var(--ink); }
  .ask-meta { margin-left:auto; display:flex; align-items:center; gap:14px; color:var(--ink-3); font-size:11px; }
  .ask-chip { font-size:9px; letter-spacing:.18em; padding:3px 9px; text-transform:uppercase; }
  .ask-chip.active { background:rgba(62,207,142,.12); color:var(--ok); }
  .ask-chip.stalled { background:rgba(242,85,90,.12); color:var(--bad); }
  #asks-label { padding:20px 40px 4px; }

  /* ── Main grid: topology + flow ────────────────────────── */
  .duo { display:grid; grid-template-columns:1fr 1fr; }
  .topo { border-right:1px solid var(--line); padding:26px 40px 30px; min-width:0; }
  .topo-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px; }
  #graph { width:100%; height:460px; background:var(--panel-2); border:1px solid var(--line); background-image:radial-gradient(circle, var(--line) 1px, transparent 1px); background-size:28px 28px; }
  .topo-hint { margin-top:12px; font-size:11px; color:var(--ink-3); }
  .flow { padding:26px 40px 30px; min-width:0; }
  .flow-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  #flow-feed { height:472px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .ev { display:grid; grid-template-columns:44px 12px 1fr; gap:12px; padding:15px 0; border-bottom:1px solid var(--line); }
  .ev:last-child { border-bottom:none; }
  .ev-time { color:var(--ink-3); font-size:11px; padding-top:2px; }
  .ev-dot { width:7px; height:7px; margin-top:6px; }
  .ev-dot.join { background:var(--ok); }
  .ev-dot.leave { background:var(--bad); }
  .ev-dot.message { background:var(--accent); }
  .ev-dot.other { background:var(--ink-3); }
  .ev-body { min-width:0; font-size:12px; }
  .ev-verb { color:var(--ink); font-weight:700; }
  .ev-id { color:var(--accent); }
  .ev-sub { color:var(--ink-2); margin-top:3px; word-break:break-word; font-size:11.5px; }
  .ev-sub .sep { color:var(--ink-3); }

  /* ── Agents ────────────────────────────────────────────── */
  .agents { padding:34px 40px 60px; }
  .agents-head { display:flex; align-items:center; gap:26px; margin-bottom:22px; flex-wrap:wrap; }
  #search {
    flex:1; min-width:220px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--ink); font-family:var(--mono); font-size:12px; padding:12px 18px; outline:none;
    transition:border-color .15s;
  }
  #search:focus { border-color:var(--accent); }
  #search::placeholder { color:var(--ink-3); }
  .peer-row {
    border:1px solid var(--line); border-left:3px solid var(--accent);
    background:var(--panel); margin-bottom:12px; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .peer-row:hover { border-color:var(--ink-3); border-left-color:var(--accent); }
  .peer-row.highlighted { border-color:var(--accent); }
  .peer-main { display:flex; align-items:center; gap:20px; padding:20px 26px; flex-wrap:wrap; }
  .peer-icon { width:38px; height:38px; object-fit:contain; flex-shrink:0; }
  .peer-icon-fallback { border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; }
  .peer-id-block { min-width:0; flex:1; }
  .peer-name {
    font-family:var(--disp); font-weight:700; font-size:21px; letter-spacing:-.02em;
    display:flex; align-items:center; gap:10px;
  }
  .peer-meta { color:var(--ink-2); font-size:11.5px; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .peer-meta .sep { color:var(--ink-3); padding:0 4px; }
  .peer-task { font-size:11.5px; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); padding:6px 12px; margin:0 26px 16px; display:inline-block; }
  .peer-side { display:flex; align-items:center; gap:14px; flex-shrink:0; flex-wrap:wrap; }
  .uptime { color:var(--ink-3); font-size:11px; letter-spacing:.14em; }
  .btn {
    font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
    background:transparent; border:1px solid var(--line); color:var(--ink-2);
    padding:9px 16px; cursor:pointer; transition:all .15s; white-space:nowrap;
  }
  .btn:hover { border-color:var(--ink-2); color:var(--ink); }
  .btn.copied { border-color:var(--ok); color:var(--ok); }
  .btn.solid { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.solid:hover { opacity:.85; }
  .status-chip { font-size:9px; letter-spacing:.18em; text-transform:uppercase; padding:4px 10px; white-space:nowrap; }
  .status-working { background:rgba(62,207,142,.12); color:var(--ok); }
  .status-waiting { background:rgba(245,176,46,.12); color:var(--warn); }
  .status-idle { background:rgba(155,155,152,.1); color:var(--ink-2); }
  .health-dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .health-ok { background:var(--ok); } .health-warn { background:var(--warn); } .health-dead { background:var(--bad); }
  .msg-history { display:none; border-top:1px solid var(--line); padding:14px 26px; }
  .msg-history.open { display:block; }
  .msg-item { font-size:11px; color:var(--ink-2); padding:5px 0; border-bottom:1px solid var(--line); word-break:break-word; }
  .msg-item:last-child { border-bottom:none; }
  .empty { color:var(--ink-3); font-size:12px; padding:34px 0; text-align:center; display:none; }

  /* ── Tooltip / modal ───────────────────────────────────── */
  #tooltip {
    position:fixed; z-index:1000; display:none; pointer-events:none;
    background:var(--panel); border:1px solid var(--line); padding:12px 16px;
    font-size:11px; min-width:180px; max-width:300px;
  }
  #tooltip .tt-role { font-weight:700; color:var(--ink); margin-bottom:6px; font-size:12px; }
  #tooltip .tt-row { display:flex; justify-content:space-between; gap:16px; margin-top:3px; color:var(--ink-2); }
  #tooltip .tt-row span:first-child { color:var(--ink-3); }
  #conv-modal { display:none; position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,.7); align-items:center; justify-content:center; }
  #conv-modal.open { display:flex; }
  #conv-box { background:var(--panel); border:1px solid var(--line); width:min(600px,94vw); max-height:80vh; display:flex; flex-direction:column; }
  #conv-header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  #conv-title { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-2); }
  #conv-close { cursor:pointer; color:var(--ink-3); font-size:18px; line-height:1; background:none; border:none; }
  #conv-close:hover { color:var(--ink); }
  #conv-messages { flex:1; overflow-y:auto; padding:18px 24px; display:flex; flex-direction:column; gap:10px; }
  .conv-msg { max-width:85%; padding:10px 14px; font-size:11.5px; border:1px solid var(--line); }
  .conv-msg.outgoing { align-self:flex-end; border-left:3px solid var(--accent); }
  .conv-msg.incoming { align-self:flex-start; border-left:3px solid var(--ink-3); }
  .conv-msg-meta { font-size:9.5px; color:var(--ink-3); margin-bottom:4px; letter-spacing:.08em; }
  .conv-msg-text { color:var(--ink-2); word-break:break-word; }
  .conv-empty { text-align:center; color:var(--ink-3); padding:40px; font-size:12px; }

  @media (max-width:1000px) {
    .duo { grid-template-columns:1fr; }
    .topo { border-right:none; border-bottom:1px solid var(--line); }
    .stats { grid-template-columns:1fr 1fr; }
    .stat:nth-child(2) { border-right:none; }
    .stat:nth-child(-n+2) { border-bottom:1px solid var(--line); }
    .metrics { grid-template-columns:1fr; }
    .metric { border-right:none; border-bottom:1px solid var(--line); }
    .metric:last-child { border-bottom:none; }
    .hero { padding:40px 28px; }
    .hero-actions { position:static; transform:none; margin-top:24px; justify-content:flex-start; }
    .topo,.flow,.agents { padding:22px 28px 28px; }
    .metric,.stat { padding-left:28px; padding-right:28px; }
    #asks-label { padding:16px 28px 4px; } .ask-row { padding:12px 28px; }
  }
  @media (max-width:640px) {
    .rail { display:none; } .shell { margin-left:0; }
    .stats { grid-template-columns:1fr 1fr; }
    .peer-main { padding:16px; gap:12px; } .peer-name { font-size:17px; }
  }
</style>
</head>
<body>

<aside class="rail">
  <div class="rail-mark"></div>
  <div class="rail-brand">AGENT MESH&nbsp;&nbsp;·&nbsp;&nbsp;<b id="rail-clock"></b>&nbsp;&nbsp;·&nbsp;&nbsp;<b id="rail-lang" onclick="toggleLang()" style="cursor:pointer">ES</b></div>
</aside>

<div id="tooltip">
  <div class="tt-role" id="tt-role"></div>
  <div class="tt-row"><span>agent</span><span id="tt-agent"></span></div>
  <div class="tt-row"><span>status</span><span id="tt-status"></span></div>
  <div class="tt-row"><span>branch</span><span id="tt-branch"></span></div>
  <div class="tt-row"><span>path</span><span id="tt-path" style="max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span></div>
</div>

<div id="conv-modal" onclick="closeConv(event)">
  <div id="conv-box">
    <div id="conv-header">
      <span id="conv-title"></span>
      <button id="conv-close" onclick="document.getElementById('conv-modal').classList.remove('open')">✕</button>
    </div>
    <div id="conv-messages"></div>
  </div>
</div>

<main class="shell">

  <!-- Hero -->
  <section class="panel hero">
    <div class="label" data-i18n="eyebrow"></div>
    <h1 id="headline">&nbsp;</h1>
    <div class="hero-actions">
      <button class="hero-btn" id="theme-btn" onclick="toggleTheme()"><span class="glyph">☐</span><span data-i18n="darkMode"></span></button>
      <button class="hero-btn" id="notif-btn" onclick="requestNotifications()"><span class="glyph">◯</span><span data-i18n="alerts"></span></button>
      <button class="hero-btn" onclick="exportActivity()"><span class="glyph">☐</span><span data-i18n="export"></span></button>
      <div class="live-chip"><span class="live-dot"></span><span data-i18n="live"></span></div>
    </div>
  </section>

  <!-- Stats -->
  <section class="panel stats">
    <div class="stat" id="stat-block-total">
      <div class="label" data-i18n="active"></div>
      <div class="stat-num" id="stat-total">00</div>
      <div class="stat-rule"></div>
    </div>
    <div class="stat" id="stat-block-working">
      <div class="label" data-i18n="working"></div>
      <div class="stat-num" id="stat-working">00</div>
      <div class="stat-rule"></div>
    </div>
    <div class="stat" id="stat-block-waiting">
      <div class="label" data-i18n="waiting"></div>
      <div class="stat-num" id="stat-waiting">00</div>
      <div class="stat-rule"></div>
    </div>
    <div class="stat" id="stat-block-conns">
      <div class="label" data-i18n="connections"></div>
      <div class="stat-num" id="metric-conns">00</div>
      <div class="stat-rule"></div>
    </div>
  </section>

  <!-- Metrics strip -->
  <section class="panel metrics">
    <div class="metric"><span class="label" data-i18n="totalMessages"></span><b id="metric-msgs">0</b></div>
    <div class="metric"><span class="label" data-i18n="lastHour"></span><b id="metric-hour">0</b></div>
    <div class="metric"><span class="label" data-i18n="mostActive"></span><b id="metric-active">–</b></div>
  </section>

  <!-- Asks in progress -->
  <section class="panel" id="asks-section">
    <div class="label" id="asks-label" data-i18n="asksInProgress"></div>
    <div id="ask-cards"></div>
  </section>

  <!-- Topology + Flow -->
  <section class="panel duo">
    <div class="topo">
      <div class="topo-head">
        <span class="label" data-i18n="topology"></span>
      </div>
      <div id="graph"></div>
      <div class="topo-hint" data-i18n="clickEdgeHint"></div>
      <div class="empty" id="no-peers" data-i18n="noAgents"></div>
    </div>
    <div class="flow">
      <div class="flow-head">
        <span class="label" data-i18n="flow"></span>
        <span class="label" id="flow-count"></span>
      </div>
      <div id="flow-feed"></div>
    </div>
  </section>

  <!-- Agents -->
  <section class="agents">
    <div class="agents-head">
      <span class="label"><span data-i18n="agents"></span>&nbsp;&nbsp;<span id="peer-count" style="color:var(--ink)">00</span></span>
      <input id="search" type="text" oninput="applyFilter()">
    </div>
    <div id="peer-cards"></div>
    <div class="empty" id="no-peers-filter" data-i18n="noResults"></div>
  </section>

</main>

<script>
// ── XSS protection ─────────────────────────────────────────────────────────
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}

// ── i18n ───────────────────────────────────────────────────────────────────
const TR = {
  en: {
    eyebrow:'MESH / REAL TIME', live:'Live',
    darkMode:'Dark mode', alerts:'Alerts', export:'Export',
    active:'ACTIVE', working:'WORKING', waiting:'WAITING', connections:'CONNECTIONS',
    totalMessages:'MESSAGES', lastHour:'LAST HOUR', mostActive:'MOST ACTIVE',
    topology:'TOPOLOGY', flow:'FLOW', agents:'AGENTS',
    events:n=>`${n} EVENT${n===1?'':'S'}`,
    noAgents:'No active agents · open an agent in another directory',
    copy:'COPY ID', messages:'MESSAGES', noResults:'No agents match the filter',
    searchPlaceholder:'filter by role, agent or path…',
    statusWorking:'working', statusWaiting:'waiting', statusIdle:'idle',
    justNow:'now', minutesAgo:m=>`${m}m`, hoursAgo:h=>`${h}h`,
    healthOk:'Healthy', healthWarn:'Slow heartbeat', healthDead:'Unresponsive',
    convTitle:(a,b)=>`${a} ↔ ${b}`, convEmpty:'No messages between these agents',
    clickEdgeHint:'Click an active link to open the conversation.',
    asksInProgress:'ASKS IN PROGRESS', signals:n=>`${n} signal${n===1?'':'s'}`,
    sinceAck:s=>`ACK ${s} ago`, noAck:'pending ACK', stallBadge:'STALLED', activeBadge:'ACTIVE',
    joined:'joined', left:'left', vMessage:'message', vStatus:'status', noMsgs:'no messages',
    headline:(a,c)=>{
      const A = a===0?'no agents online':a===1?'one agent online':`${numEn(a)} agents online`;
      const C = c===0?'no links open':c===1?'one link open':`${numEn(c)} links open`;
      return capFirst(`${A}, ${C}.`);
    },
  },
  es: {
    eyebrow:'MALLA / TIEMPO REAL', live:'En vivo',
    darkMode:'Modo oscuro', alerts:'Alertas', export:'Exportar',
    active:'ACTIVOS', working:'TRABAJANDO', waiting:'EN ESPERA', connections:'CONEXIONES',
    totalMessages:'MENSAJES', lastHour:'ÚLTIMA HORA', mostActive:'MÁS ACTIVO',
    topology:'TOPOLOGÍA', flow:'FLUJO', agents:'AGENTES',
    events:n=>`${n} EVENTO${n===1?'':'S'}`,
    noAgents:'Sin agentes activos · abre un agente en otro directorio',
    copy:'COPIAR ID', messages:'MENSAJES', noResults:'Ningún agente coincide',
    searchPlaceholder:'filtrar por rol, agente o ruta…',
    statusWorking:'trabajando', statusWaiting:'esperando', statusIdle:'inactivo',
    justNow:'ahora', minutesAgo:m=>`${m}m`, hoursAgo:h=>`${h}h`,
    healthOk:'Activo', healthWarn:'Heartbeat lento', healthDead:'Sin respuesta',
    convTitle:(a,b)=>`${a} ↔ ${b}`, convEmpty:'Sin mensajes entre estos agentes',
    clickEdgeHint:'Clic en un enlace activo para abrir la conversación.',
    asksInProgress:'PREGUNTAS EN CURSO', signals:n=>`${n} señal${n===1?'':'es'}`,
    sinceAck:s=>`ACK hace ${s}`, noAck:'ACK pendiente', stallBadge:'DETENIDO', activeBadge:'ACTIVO',
    joined:'entró', left:'salió', vMessage:'mensaje', vStatus:'estado', noMsgs:'sin mensajes',
    headline:(a,c)=>{
      const A = a===0?'ningún agente en línea':a===1?'un agente en línea':`${numEs(a)} agentes en línea`;
      const C = c===0?'ningún enlace abierto':c===1?'un enlace abierto':`${numEs(c)} enlaces abiertos`;
      return capFirst(`${A}, ${C}.`);
    },
  },
};

const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);

// ── Agent data ─────────────────────────────────────────────────────────────
const AGENT_COLORS = { 'claude-code':'#e07840','gemini-cli':'#4d8dfa','opencode':'#9d7bfa','copilot':'#3ecf8e','codex':'#f26d9a','unknown':'#8a8a86' };
const AGENT_LABELS = { 'claude-code':'CC','gemini-cli':'GM','opencode':'OC','copilot':'CP','codex':'CX','unknown':'?' };
const AGENT_ICONS  = { 'claude-code':'/icons/claude-code.ico','gemini-cli':'/icons/gemini-cli.ico','opencode':'/icons/opencode.png','copilot':'/icons/copilot.jpg','codex':'/icons/codex.png' };

let cy = null;
let lastPeers = [];
let lastPeerCount = 0;
let filterText = '';
let allActivityLines = [];
let allConnections = [];
let recentEdgeTimes = {};
const RECENT_MS = 30_000;
let highlightedPeer = null;

// ── Helpers ────────────────────────────────────────────────────────────────
const pad2 = n => String(n).padStart(2,'0');
function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(diff/60000), h = Math.floor(diff/3600000);
  if (diff < 30000) return t('justNow');
  if (h >= 1) return t('hoursAgo',h);
  return t('minutesAgo',m);
}
function statusLabel(s){ return s==='working'?t('statusWorking'):s==='waiting'?t('statusWaiting'):t('statusIdle'); }
function healthInfo(hb) {
  const age = Date.now() - new Date(hb).getTime();
  if (age < 20000) return { cls:'health-ok', tip:t('healthOk') };
  if (age < 45000) return { cls:'health-warn', tip:t('healthWarn') };
  return { cls:'health-dead', tip:t('healthDead') };
}

// ── Notifications ──────────────────────────────────────────────────────────
let notificationsEnabled = false;
let initialized = false;
let knownPeerIds = new Set();
let knownMsgCount = -1;

async function requestNotifications() {
  if (!('Notification' in window)) return;
  const perm = await Notification.requestPermission();
  notificationsEnabled = perm === 'granted';
  const btn = document.getElementById('notif-btn');
  btn.classList.toggle('on', notificationsEnabled);
  btn.querySelector('.glyph').textContent = notificationsEnabled ? '●' : '◯';
}
function notify(title, body) {
  if (!notificationsEnabled || !initialized) return;
  if (document.visibilityState === 'visible') return;
  new Notification(title, { body, icon:'/logo.svg' });
}
function checkNotifications(peers) {
  const msgLines = allActivityLines.filter(l => l.includes('|message|'));
  if (!initialized) {
    peers.forEach(p => knownPeerIds.add(p.id));
    knownMsgCount = msgLines.length;
    initialized = true;
    return;
  }
  peers.forEach(p => {
    if (!knownPeerIds.has(p.id)) { knownPeerIds.add(p.id); notify('agent-mesh', `${p.agent} — ${p.role}`); }
  });
  if (knownMsgCount >= 0 && msgLines.length > knownMsgCount) {
    const newest = msgLines[0]?.split('|').slice(2).join(' · ').slice(0,80) ?? '';
    notify('agent-mesh', newest || 'New message');
  }
  knownMsgCount = msgLines.length;
}

// ── Metrics ────────────────────────────────────────────────────────────────
function updateMetrics(peers, connections) {
  const msgLines = allActivityLines.filter(l => l.includes('|message|'));
  const hourAgo = Date.now() - 3_600_000;
  const lastHour = msgLines.filter(l => new Date(l.split('|')[0]).getTime() > hourAgo).length;
  const counts = {};
  msgLines.forEach(l => {
    const m = (l.split('|')[2]??'').match(/^(peer_\w+)→/);
    if (m) counts[m[1]] = (counts[m[1]]??0)+1;
  });
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const topPeer = top ? peers.find(p=>p.id===top[0]) : null;
  document.getElementById('metric-msgs').textContent = msgLines.length;
  document.getElementById('metric-hour').textContent = lastHour;
  document.getElementById('metric-active').textContent = topPeer ? `${topPeer.role} (${top[1]})` : (top ? `${top[0].slice(0,12)} (${top[1]})` : '–');
  document.getElementById('metric-conns').textContent = pad2(connections.length);
  document.getElementById('stat-block-conns').classList.toggle('lit', connections.length>0);
  updateHeadline();
}

// ── Conversation modal ─────────────────────────────────────────────────────
function openConversation(idA, idB) {
  const peerA = lastPeers.find(p=>p.id===idA), peerB = lastPeers.find(p=>p.id===idB);
  const labelA = peerA?.role ?? idA.slice(0,10), labelB = peerB?.role ?? idB.slice(0,10);
  document.getElementById('conv-title').textContent = t('convTitle', labelA, labelB);
  const msgs = allActivityLines.filter(l => {
    const parts = l.split('|');
    if (parts[1]?.trim() !== 'message') return false;
    const data = parts[2] ?? '';
    return data.includes(idA) && data.includes(idB);
  }).reverse();
  const container = document.getElementById('conv-messages');
  if (!msgs.length) container.innerHTML = `<div class="conv-empty">${t('convEmpty')}</div>`;
  else {
    container.innerHTML = msgs.map(l => {
      const parts = l.split('|');
      const m = (parts[2]??'').match(/^(peer_\w+)→(peer_\w+)\|(\w+)\|(.*)/s);
      if (!m) return '';
      const outgoing = m[1] === idA;
      return `<div class="conv-msg ${outgoing?'outgoing':'incoming'}">
        <div class="conv-msg-meta">${escapeHtml(outgoing?labelA:labelB)} · ${escapeHtml(m[3])} · ${timeAgo(parts[0])}</div>
        <div class="conv-msg-text">${escapeHtml((m[4]??'').slice(0,300))}</div>
      </div>`;
    }).join('');
    container.scrollTop = container.scrollHeight;
  }
  document.getElementById('conv-modal').classList.add('open');
}
function closeConv(e) {
  if (e.target === document.getElementById('conv-modal'))
    document.getElementById('conv-modal').classList.remove('open');
}

// ── Graph (Cytoscape) ──────────────────────────────────────────────────────
function initGraph() {
  const c = gColors();
  cy = cytoscape({
    container: document.getElementById('graph'),
    style: [
      { selector: 'node', style: {
          'background-color':'data(bgcolor)', 'background-image':'data(icon)',
          'background-fit':'contain', 'background-clip':'none', 'background-opacity':0,
          'border-width':0, label:'data(label)', color:c.node,
          'text-valign':'bottom', 'text-halign':'center', 'text-margin-y':8,
          'font-size':'10px', 'font-weight':'bold', 'font-family':'monospace',
          width:72, height:72, 'text-wrap':'wrap', 'text-max-width':'160px',
      }},
      { selector:'node[icon = "none"]', style:{
          'background-color':'data(color)', 'background-opacity':1, 'background-image':'none',
          'border-width':0, color:'#fff', 'text-valign':'center', 'text-halign':'center',
          'text-margin-y':0, label:'data(initials)', 'font-size':'14px',
      }},
      { selector:'node[status = "working"]', style:{ 'border-width':2,'border-color':'#3ecf8e','background-opacity':0.08,'background-color':'#3ecf8e' }},
      { selector:'node[status = "waiting"]', style:{ 'border-width':2,'border-color':'#f5b02e','background-opacity':0.08,'background-color':'#f5b02e' }},
      { selector:'node.highlighted', style:{ 'border-width':3,'border-color':'#4d8dfa' }},
      { selector:'edge', style:{
          width:1.5, 'line-color':c.edge, 'target-arrow-color':c.arrow,
          'target-arrow-shape':'triangle', 'curve-style':'bezier',
          opacity:0.5, 'line-style':'dashed', 'line-dash-pattern':[4,4],
      }},
      { selector:'edge.active', style:{
          'line-color':c.active, 'target-arrow-color':c.active,
          opacity:0.9, 'line-style':'solid', width:2.5,
      }},
      { selector:'edge:hover', style:{ opacity:1, width:3, cursor:'pointer' }},
    ],
    layout:{ name:'grid' },
    userZoomingEnabled:true, userPanningEnabled:true,
  });

  const tooltip = document.getElementById('tooltip');
  cy.on('mouseover','node', e => {
    const d = e.target.data();
    document.getElementById('tt-role').textContent = d.label || d.id;
    document.getElementById('tt-agent').textContent = d.agent || '–';
    document.getElementById('tt-status').textContent = statusLabel(d.status || 'idle');
    document.getElementById('tt-branch').textContent = d.branch || '–';
    document.getElementById('tt-path').textContent = d.path || '–';
    tooltip.style.display = 'block';
  });
  cy.on('mouseout','node', () => { tooltip.style.display = 'none'; });
  cy.on('mousemove', e => {
    tooltip.style.left = (e.originalEvent.clientX + 16) + 'px';
    tooltip.style.top  = (e.originalEvent.clientY - 10) + 'px';
  });

  cy.on('tap','node', e => {
    const id = e.target.id();
    document.querySelectorAll('.peer-row').forEach(r => r.classList.remove('highlighted'));
    cy.nodes().removeClass('highlighted');
    e.target.addClass('highlighted');
    highlightedPeer = id;
    const card = document.querySelector(`.peer-row[data-peer-id="${id}"]`);
    if (card) { card.classList.add('highlighted'); card.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
  });

  cy.on('tap','edge', e => {
    const d = e.target.data();
    openConversation(d.source, d.target);
  });

  cy.on('tap', e => {
    if (e.target === cy) {
      highlightedPeer = null;
      cy.nodes().removeClass('highlighted');
      document.querySelectorAll('.peer-row').forEach(r => r.classList.remove('highlighted'));
    }
  });
}

function updateGraph(peers) {
  if (!cy) return;
  document.getElementById('no-peers').style.display = peers.length ? 'none' : 'block';
  const currentIds = new Set(peers.map(p => p.id));
  const graphIds = new Set(cy.nodes().map(n => n.id()));
  const countChanged = peers.length !== lastPeerCount;

  cy.nodes().forEach(n => { if (!currentIds.has(n.id())) cy.remove(n); });

  for (const peer of peers) {
    const color    = AGENT_COLORS[peer.agent] ?? '#8a8a86';
    const icon     = AGENT_ICONS[peer.agent]  ?? 'none';
    const bgcolor  = icon !== 'none' ? 'transparent' : color;
    const initials = AGENT_LABELS[peer.agent] ?? '?';
    const data     = { label:peer.role, status:peer.status, color, bgcolor, icon, initials, agent:peer.agent, branch:peer.git_branch||'', path:peer.path||'' };
    if (graphIds.has(peer.id)) cy.$(`#${peer.id}`).data(data);
    else cy.add({ data:{ id:peer.id, ...data } });
  }

  cy.edges().forEach(e => {
    if (!currentIds.has(e.data('source')) || !currentIds.has(e.data('target'))) cy.remove(e);
  });

  const now = Date.now();
  cy.edges().forEach(e => {
    const age = now - (recentEdgeTimes[e.id()] ?? 0);
    if (age < RECENT_MS) e.addClass('active'); else e.removeClass('active');
  });

  if (countChanged) {
    lastPeerCount = peers.length;
    cy.layout({ name:peers.length<=1?'grid':'circle', padding:80, animate:false, spacingFactor:1.6 }).run();
    cy.resize();
  }
}

function highlightPeer(id) {
  highlightedPeer = highlightedPeer === id ? null : id;
  document.querySelectorAll('.peer-row').forEach(c => c.classList.toggle('highlighted', c.dataset.peerId === highlightedPeer));
  cy?.nodes().removeClass('highlighted');
  if (highlightedPeer) cy?.$(`#${highlightedPeer}`)?.addClass('highlighted');
}

// ── Peer rows ──────────────────────────────────────────────────────────────
function peerMessages(peerId) {
  return allActivityLines.filter(l => {
    const parts = l.split('|');
    return parts[1]?.trim() === 'message' && (parts[2]??'').includes(peerId);
  }).slice(0,8);
}
function statusChip(status){ return `<span class="status-chip status-${status}">${statusLabel(status)}</span>`; }

function renderPeerCards(peers) {
  const sorted = [...peers].sort((a,b)=>a.started_at.localeCompare(b.started_at));
  const filtered = filterText ? sorted.filter(p => [p.role,p.agent,p.path,p.git_branch].join(' ').toLowerCase().includes(filterText)) : sorted;

  const container = document.getElementById('peer-cards');
  const noFilter = document.getElementById('no-peers-filter');
  document.getElementById('peer-count').textContent =
    filtered.length !== sorted.length ? `${pad2(filtered.length)}/${pad2(sorted.length)}` : pad2(sorted.length);

  if (!sorted.length) { container.innerHTML=''; noFilter.style.display='none'; return; }
  if (!filtered.length) { container.innerHTML=''; noFilter.style.display='block'; return; }
  noFilter.style.display = 'none';

  const filteredIds = new Set(filtered.map(p=>p.id));
  container.querySelectorAll('.peer-row').forEach(row => {
    if (!filteredIds.has(row.dataset.peerId)) row.remove();
  });

  filtered.forEach(peer => {
    const uptime = peer.started_at ? Math.floor((Date.now()-new Date(peer.started_at).getTime())/60000) : null;
    const uptimeStr = uptime !== null ? (uptime >= 60 ? `${Math.floor(uptime/60)}H ${uptime%60}M` : `${uptime}M`) : '';
    const health = healthInfo(peer.last_heartbeat);
    const msgs = peerMessages(peer.id);
    const msgsHtml = msgs.length
      ? msgs.map(l => { const p=l.split('|'); return `<div class="msg-item">${timeAgo(p[0])} · ${escapeHtml(p.slice(2).join(' · ').slice(0,90))}</div>`; }).join('')
      : `<div class="msg-item" style="border:none;font-style:italic">${t('noMsgs')}</div>`;
    const version = peer.agent_version !== 'unknown' ? ` ${escapeHtml(peer.agent_version)}` : '';
    const taskHtml = peer.current_task ? `<div class="peer-task">${escapeHtml(peer.current_task)}</div>` : '';
    const color = AGENT_COLORS[peer.agent] ?? '#8a8a86';
    const iconHtml = AGENT_ICONS[peer.agent]
      ? `<img class="peer-icon" src="${AGENT_ICONS[peer.agent]}" alt="${escapeHtml(peer.agent)}"/>`
      : `<div class="peer-icon peer-icon-fallback" style="background:${color}">${AGENT_LABELS[peer.agent]??'?'}</div>`;

    let row = container.querySelector(`.peer-row[data-peer-id="${escapeHtml(peer.id)}"]`);
    if (!row) {
      row = document.createElement('div');
      row.className = 'peer-row';
      row.dataset.peerId = peer.id;
      row.addEventListener('click', () => highlightPeer(peer.id));
      row.innerHTML = `
        <div class="peer-main">
          ${iconHtml}
          <div class="peer-id-block">
            <div class="peer-name">
              ${escapeHtml(peer.role)}
              <span class="health-dot ${health.cls}" data-field="health" title="${escapeHtml(health.tip)}"></span>
              <span data-field="status">${statusChip(peer.status)}</span>
            </div>
            <div class="peer-meta">${escapeHtml(peer.agent)}${version}<span class="sep">·</span>${escapeHtml(peer.id)}<span class="sep">·</span>${escapeHtml(peer.path)}${peer.git_branch?`<span class="sep">·</span>⎇ ${escapeHtml(peer.git_branch)}`:''}</div>
          </div>
          <div class="peer-side">
            <span class="uptime" data-field="uptime">${uptimeStr}</span>
            <button class="btn" data-copy-id="${escapeHtml(peer.id)}" onclick="event.stopPropagation();copyPeerId(this)">${t('copy')}</button>
            <button class="btn solid" data-field="msg-toggle" onclick="event.stopPropagation();toggleHistory('${escapeHtml(peer.id)}')">${t('messages')} ${msgs.length}</button>
          </div>
        </div>
        <div data-field="task">${taskHtml}</div>
        <div class="msg-history" id="hist-${escapeHtml(peer.id)}">${msgsHtml}</div>`;
      container.appendChild(row);
    } else {
      const statusEl = row.querySelector('[data-field="status"]');
      if (statusEl) statusEl.innerHTML = statusChip(peer.status);
      const healthEl = row.querySelector('[data-field="health"]');
      if (healthEl) { healthEl.className = `health-dot ${health.cls}`; healthEl.title = health.tip; }
      const taskEl = row.querySelector('[data-field="task"]');
      if (taskEl) taskEl.innerHTML = taskHtml;
      const uptimeEl = row.querySelector('[data-field="uptime"]');
      if (uptimeEl) uptimeEl.textContent = uptimeStr;
      const toggleEl = row.querySelector('[data-field="msg-toggle"]');
      if (toggleEl) toggleEl.textContent = `${t('messages')} ${msgs.length}`;
    }
  });
}

function toggleHistory(peerId) {
  document.getElementById(`hist-${peerId}`)?.classList.toggle('open');
}

function copyPeerId(btn) {
  const peerId = btn.dataset.copyId;
  const original = btn.textContent;
  navigator.clipboard.writeText(peerId).then(() => {
    btn.textContent = '✓ ' + (currentLang==='es'?'COPIADO':'COPIED');
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1800);
  }).catch(() => {
    btn.textContent = '✗';
    setTimeout(() => { btn.textContent = original; }, 1800);
  });
}

// ── Flow feed ──────────────────────────────────────────────────────────────
function parseEvent(line) {
  const parts = line.split('|');
  const ts = parts[0], type = (parts[1]??'').trim();
  if (type === 'message') {
    const m = (parts[2]??'').match(/^(peer_\w+)→(peer_\w+)$/) ? null : (parts[2]??'').match(/^(peer_\w+)→(peer_\w+)/);
    const content = parts.slice(4).join('|') || parts[4] || '';
    return { ts, type, dot:'message', verb:t('vMessage'), id:m?m[1]:'', sub:`${m?`→ ${m[2]}`:''}${parts[3]?` · ${parts[3]}`:''}${content?` · ${content.slice(0,90)}`:''}` };
  }
  if (type === 'peer_join')    return { ts, type, dot:'join',  verb:t('joined'), id:parts[2]??'', sub:[parts[3],parts[4]].filter(Boolean).join(' · ') + (parts[5]?` · ${parts[5]}`:'') };
  if (type === 'peer_leave' || type === 'peer_timeout')
    return { ts, type, dot:'leave', verb:t('left'), id:parts[2]??'', sub:[parts[3],parts[4]].filter(Boolean).join(' · ') };
  if (type === 'peer_status')  return { ts, type, dot:'other', verb:t('vStatus'), id:parts[2]??'', sub:[parts[3],parts[4]].filter(Boolean).join(' · ') };
  return { ts, type, dot:'other', verb:type, id:'', sub:parts.slice(2).join(' · ') };
}

function renderActivity(lines) {
  const feed = document.getElementById('flow-feed');
  if (!feed) return;
  const shown = lines.slice(0,40);
  document.getElementById('flow-count').textContent = t('events', shown.length);
  feed.innerHTML = shown.map(line => {
    const ev = parseEvent(line);
    return `<div class="ev">
      <span class="ev-time">${ev.ts?timeAgo(ev.ts):''}</span>
      <span class="ev-dot ${ev.dot}"></span>
      <div class="ev-body">
        <span class="ev-verb">${escapeHtml(ev.verb)}</span> <span class="ev-id">${escapeHtml(ev.id)}</span>
        ${ev.sub?`<div class="ev-sub">${escapeHtml(ev.sub)}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ── Asks in progress ───────────────────────────────────────────────────────
function ageStr(isoStr) {
  if (!isoStr) return null;
  const s = Math.floor((Date.now()-new Date(isoStr).getTime())/1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s/60);
  if (m < 60) return `${m}m ${s%60}s`;
  return `${Math.floor(m/60)}h ${m%60}m`;
}
function renderAsksInProgress(asks) {
  const section = document.getElementById('asks-section');
  const container = document.getElementById('ask-cards');
  if (!asks.length) { section.style.display='none'; container.innerHTML=''; return; }
  section.style.display = 'block';
  document.getElementById('asks-label').textContent = t('asksInProgress');
  const STALE_MS = 30_000;
  container.innerHTML = asks.map(ask => {
    const lastProg = ask.progress_last_at ? new Date(ask.progress_last_at).getTime() : null;
    const stalled = lastProg !== null && (Date.now()-lastProg > STALE_MS);
    const ackAge = ask.acked_at ? ageStr(ask.acked_at) : null;
    const progAge = ask.progress_last_at ? ageStr(ask.progress_last_at) : null;
    const count = ask.progress_count ?? 0;
    const fromPeer = lastPeers.find(p=>p.id===ask.from_id), toPeer = lastPeers.find(p=>p.id===ask.to_id);
    const fromLabel = escapeHtml(fromPeer?.role ?? ask.from_id.slice(0,14));
    const toLabel = escapeHtml(toPeer?.role ?? ask.to_id.slice(0,14));
    const chip = stalled ? `<span class="ask-chip stalled">${t('stallBadge')}</span>` : `<span class="ask-chip active">${t('activeBadge')}</span>`;
    const ackInfo = ackAge ? t('sinceAck',ackAge) : t('noAck');
    const progInfo = count > 0 ? ` · ${t('signals',count)}${progAge?` · ${progAge}`:''}` : '';
    return `<div class="ask-row">
      <span class="who">${fromLabel}</span><span class="arrow">→</span><span class="who">${toLabel}</span>
      <span class="ask-meta">${escapeHtml(ackInfo)}${escapeHtml(progInfo)}${chip}</span>
    </div>`;
  }).join('');
}
async function fetchAsksInProgress() {
  try {
    const asks = await fetch('/api/asks/in-progress').then(r=>r.json());
    renderAsksInProgress(asks ?? []);
  } catch {}
}

// ── Data fetching ──────────────────────────────────────────────────────────
async function fetchConnections() {
  try {
    const pairs = await fetch('/api/connections').then(r=>r.json());
    allConnections = pairs;
    if (cy) {
      for (const {a,b} of pairs) {
        const edgeId = [a,b].sort().join('--');
        if (!cy.$(`#${edgeId}`).length && cy.$(`#${a}`).length && cy.$(`#${b}`).length) {
          cy.add({ data:{ id:edgeId, source:a, target:b } });
        }
      }
      cy.edges().forEach(e => {
        const active = pairs.some(p => [p.a,p.b].sort().join('--') === e.id());
        if (!active) cy.remove(e);
      });
    }
    updateMetrics(lastPeers, pairs);
  } catch {}
}
async function fetchActivity() {
  try {
    const lines = await fetch('/api/activity?limit=50').then(r=>r.json());
    allActivityLines = lines;
    renderActivity(lines);
    lines.forEach(l => {
      const parts = l.split('|');
      if (parts[1]?.trim() === 'message') {
        const m = (parts[2]??'').match(/^(peer_\w+)→(peer_\w+)/);
        if (m) {
          const edgeId = [m[1],m[2]].sort().join('--');
          const ts = new Date(parts[0]).getTime();
          if (!recentEdgeTimes[edgeId] || ts > recentEdgeTimes[edgeId]) recentEdgeTimes[edgeId] = ts;
        }
      }
    });
  } catch {}
}
async function fetchPeers() {
  try {
    const data = await fetch('/api/stats').then(r=>r.json());
    updateStats(data);
    lastPeers = data.peers ?? [];
    renderPeerCards(lastPeers);
    updateGraph(lastPeers);
    checkNotifications(lastPeers);
    updateMetrics(lastPeers, allConnections);
  } catch {}
}
function connectSSE() {
  const es = new EventSource('/api/stream');
  es.onmessage = e => {
    try {
      const data = JSON.parse(e.data);
      updateStats(data);
      lastPeers = data.peers ?? [];
      renderPeerCards(lastPeers);
      updateGraph(lastPeers);
      updateHeadline();
    } catch {}
  };
  es.onerror = () => { es.close(); setTimeout(connectSSE, 3000); };
}

// ── Init ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  applyI18n();
  tickClock();
  setInterval(tickClock, 1000);
  initGraph();
  requestAnimationFrame(async () => {
    cy.resize();
    await fetchActivity();
    await fetchPeers();
    await fetchConnections();
    fetchAsksInProgress();
    connectSSE();
  });
  setInterval(fetchPeers, 2000);
  setInterval(fetchConnections, 3000);
  setInterval(fetchActivity, 2000);
  setInterval(fetchAsksInProgress, 3000);
});
</script>
