<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Mesh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
  <style>
    :root {
      --status-working:  #10b981;
      --status-waiting:  #f59e0b;
      --status-idle:     #6b7280;
      --status-dead:     #ef4444;
      --bg-main:         #0a0f1e;
      --bg-card:         #111827;
      --bg-graph:        #0d1424;
      --bg-hover:        #1e293b;
      --border:          #1e293b;
      --text-primary:    #f1f5f9;
      --text-secondary:  #94a3b8;
      --text-muted:      #475569;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; overflow-x: hidden; }
    body { background: var(--bg-main); color: var(--text-primary); font-family: 'SF Mono', 'Fira Code', monospace; }

    .page { max-width: 1400px; margin: 0 auto; padding: 20px 20px; }

    #graph {
      width: 100%;
      height: 340px;
      background: var(--bg-graph);
      border-radius: 10px;
      border: 1px solid var(--border);
      background-image: radial-gradient(circle, #1e293b 1px, transparent 1px);
      background-size: 28px 28px;
    }
    #activity-feed {
      height: 340px;
      overflow-y: auto;
      background: var(--bg-card);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      min-width: 0;
    }
    .two-col > * { min-width: 0; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .peer-card {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
      min-width: 0;
    }
    .peer-card:hover { border-color: #334155; }
    .peers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .status-badge {
      font-size: 9px; font-weight: bold; padding: 2px 7px;
      border-radius: 999px; letter-spacing: 0.05em; text-transform: uppercase;
      white-space: nowrap; flex-shrink: 0;
    }
    .status-working { background: rgba(16,185,129,0.15); color: #10b981; }
    .status-waiting { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .status-idle    { background: rgba(107,114,128,0.12); color: #6b7280; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .feed-item { padding: 6px 10px; border-left: 2px solid #1e293b; border-radius: 0 4px 4px 0; margin-bottom: 4px; }
    .feed-item.message { border-color: #3b82f6; background: rgba(59,130,246,0.04); }
    .feed-item.join    { border-color: #10b981; background: rgba(16,185,129,0.04); }
    .feed-item.leave   { border-color: #ef4444; background: rgba(239,68,68,0.04); }
    .feed-time { font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 1px; }
    .feed-desc { font-size: 11px; color: var(--text-secondary); word-break: break-word; }

    .stat-bar { height: 3px; border-radius: 2px; margin-top: 8px; background: var(--border); overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

    .copy-btn { cursor: pointer; opacity: 0.5; font-size: 10px; padding: 1px 5px; border: 1px solid var(--border); border-radius: 3px; background: transparent; color: var(--text-muted); }
    .copy-btn:hover { opacity: 1; }
    #no-peers { display: none; }
    .section-label { font-size: 10px; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px; }

    @media (max-width: 860px) {
      .two-col   { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      #graph, #activity-feed { height: 300px; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .peers-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div>
        <h1 style="color:#60a5fa;letter-spacing:0.2em;font-size:1.1rem;font-weight:bold;margin:0">AGENT-MESH</h1>
        <div style="font-size:10px;color:var(--text-muted);margin-top:2px"><span id="last-update">actualizando...</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite"></span>
        <span style="font-size:11px;color:var(--text-muted)">live</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" style="margin-bottom:16px">
      <div class="card p-4">
        <div style="font-size:10px;color:var(--text-muted)">ACTIVOS</div>
        <div id="stat-total" style="font-size:2rem;font-weight:bold;color:#34d399;margin-top:4px">0</div>
        <div class="stat-bar"><div id="bar-total" class="stat-bar-fill" style="background:#34d399;width:0%"></div></div>
      </div>
      <div class="card p-4">
        <div style="font-size:10px;color:var(--text-muted)">TRABAJANDO</div>
        <div id="stat-working" style="font-size:2rem;font-weight:bold;color:#60a5fa;margin-top:4px">0</div>
        <div class="stat-bar"><div id="bar-working" class="stat-bar-fill" style="background:#60a5fa;width:0%"></div></div>
      </div>
      <div class="card p-4">
        <div style="font-size:10px;color:var(--text-muted)">ESPERANDO</div>
        <div id="stat-waiting" style="font-size:2rem;font-weight:bold;color:#fbbf24;margin-top:4px">0</div>
        <div class="stat-bar"><div id="bar-waiting" class="stat-bar-fill" style="background:#fbbf24;width:0%"></div></div>
      </div>
    </div>

    <!-- Graph + Feed -->
    <div class="two-col" style="margin-bottom:16px">
      <div>
        <div class="section-label">RED DE AGENTES</div>
        <div id="graph" style="height:340px"></div>
        <div id="no-peers" style="text-align:center;padding:32px 0;color:var(--text-muted)">
          Sin agentes activos · Abre un agente en otro directorio
        </div>
      </div>
      <div>
        <div class="section-label">ACTIVIDAD RECIENTE</div>
        <div id="activity-feed" style="height:340px"></div>
      </div>
    </div>

    <!-- Peer cards -->
    <div class="section-label">AGENTES</div>
    <div id="peer-cards" class="peers-grid"></div>
  </div>

  <script>
    const AGENT_COLORS = {
      'claude-code': '#f97316',
      'gemini-cli':  '#3b82f6',
      'opencode':    '#8b5cf6',
      'copilot':     '#22c55e',
      'codex':       '#ec4899',
      'unknown':     '#64748b',
    };

    const AGENT_LABELS = {
      'claude-code': 'CC',
      'gemini-cli':  'GM',
      'opencode':    'OC',
      'copilot':     'CP',
      'codex':       'CX',
      'unknown':     '?',
    };

    const AGENT_ICONS = {
      'claude-code': '/icons/claude-code.ico',
      'gemini-cli':  '/icons/gemini-cli.ico',
      'opencode':    '/icons/opencode.png',
      'copilot':     '/icons/copilot.jpg',
      'codex':       '/icons/codex.png',
    };

    let cy = null;
    let lastPeers = [];

    function initGraph() {
      cy = cytoscape({
        container: document.getElementById('graph'),
        style: [
          {
            selector: 'node',
            style: {
              'background-color': 'data(bgcolor)',
              'background-image': 'data(icon)',
              'background-fit': 'contain',
              'background-clip': 'none',
              'background-opacity': 0,
              'border-width': 0,
              'label': 'data(label)',
              'color': '#94a3b8',
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': 8,
              'font-size': '10px',
              'font-weight': 'bold',
              'font-family': 'monospace',
              'width': 72,
              'height': 72,
              'text-wrap': 'wrap',
              'text-max-width': '160px',
            }
          },
          {
            selector: 'node[?hasColor]',
            style: {
              'background-color': 'data(color)',
              'background-opacity': 1,
              'border-width': 0,
            }
          },
          {
            selector: 'node[status = "working"]',
            style: {
              'border-width': 2,
              'border-color': '#10b981',
              'background-opacity': 0.08,
              'background-color': '#10b981',
            }
          },
          {
            selector: 'node[status = "waiting"]',
            style: {
              'border-width': 2,
              'border-color': '#f59e0b',
              'background-opacity': 0.08,
              'background-color': '#f59e0b',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': 1.5,
              'line-color': '#334155',
              'target-arrow-color': '#475569',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.5,
              'line-style': 'dashed',
              'line-dash-pattern': [4, 4],
            }
          },
          {
            selector: 'edge.active',
            style: {
              'line-color': '#3b82f6',
              'target-arrow-color': '#3b82f6',
              'opacity': 0.9,
              'line-style': 'solid',
              'width': 2,
            }
          }
        ],
        layout: { name: 'grid' },
        userZoomingEnabled: true,
        userPanningEnabled: true,
      });
    }

    let lastPeerCount = 0;

    function updateGraph(peers) {
      if (!cy) return;

      const currentIds = new Set(peers.map(p => p.id));
      const graphIds = new Set(cy.nodes().map(n => n.id()));
      const countChanged = peers.length !== lastPeerCount;

      cy.nodes().forEach(n => {
        if (!currentIds.has(n.id())) cy.remove(n);
      });

      for (const peer of peers) {
        const label = peer.role;
        const color = AGENT_COLORS[peer.agent] ?? '#64748b';
        const icon = AGENT_ICONS[peer.agent] ?? 'none';
        const bgcolor = icon !== 'none' ? 'transparent' : color;
        if (graphIds.has(peer.id)) {
          cy.$(`#${peer.id}`).data({ label, status: peer.status, color, bgcolor, icon });
        } else {
          cy.add({ data: { id: peer.id, label, status: peer.status, color, bgcolor, icon } });
        }
      }

      // Eliminar edges de peers que ya no existen
      cy.edges().forEach(e => {
        if (!currentIds.has(e.data('source')) || !currentIds.has(e.data('target'))) {
          cy.remove(e);
        }
      });

      // Solo re-layoutear si cambió la cantidad de peers
      if (countChanged) {
        lastPeerCount = peers.length;
        const layoutName = peers.length <= 1 ? 'grid' : 'circle';
        cy.layout({ name: layoutName, padding: 80, animate: false, spacingFactor: 1.6 }).run();
        cy.resize();
      }
    }

    function statusBadge(status) {
      return `<span class="status-badge status-${status}">${status}</span>`;
    }

    function renderPeerCards(peers) {
      // Orden estable por fecha de inicio para que no cambie entre updates
      const sorted = [...peers].sort((a, b) => a.started_at.localeCompare(b.started_at));
      const container = document.getElementById('peer-cards');
      if (sorted.length === 0) {
        container.innerHTML = '';
        document.getElementById('no-peers').style.display = 'block';
        return;
      }
      document.getElementById('no-peers').style.display = 'none';

      container.innerHTML = sorted.map(peer => {
        const color = AGENT_COLORS[peer.agent] ?? '#64748b';
        const iconHtml = AGENT_ICONS[peer.agent]
          ? `<img src="${AGENT_ICONS[peer.agent]}" style="width:32px;height:32px;object-fit:contain;flex-shrink:0" />`
          : `<div style="background:${color};width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="color:#fff;font-size:12px;font-weight:bold">${AGENT_LABELS[peer.agent] ?? '?'}</span></div>`;

        const uptime = peer.started_at
          ? Math.floor((Date.now() - new Date(peer.started_at).getTime()) / 60000) + 'm'
          : '';

        return `
          <div class="peer-card">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-2">
                ${iconHtml}
                <div>
                  <div class="font-semibold text-sm">${peer.role}</div>
                  <div style="font-size:10px;color:var(--text-muted)">${peer.agent} ${peer.agent_version !== 'unknown' ? peer.agent_version : ''}</div>
                </div>
              </div>
              ${statusBadge(peer.status)}
            </div>
            <div class="space-y-1" style="font-size:11px;color:var(--text-secondary)">
              <div style="color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${peer.path}</div>
              ${peer.git_branch ? `<div style="color:#60a5fa">⎇ ${peer.git_branch}</div>` : ''}
              ${peer.current_task ? `<div style="color:var(--text-primary);margin-top:6px;padding:6px 8px;background:rgba(255,255,255,0.04);border-radius:6px">${peer.current_task}</div>` : ''}
            </div>
            <div class="flex items-center justify-between mt-3" style="border-top:1px solid var(--border);padding-top:8px">
              <span style="color:var(--text-muted);font-size:10px">${peer.id}</span>
              <div class="flex items-center gap-2">
                ${uptime ? `<span style="color:var(--text-muted);font-size:10px">${uptime}</span>` : ''}
                <button class="copy-btn" onclick="navigator.clipboard.writeText('${peer.id}')">copy</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderActivity(lines) {
      const feed = document.getElementById('activity-feed');
      feed.innerHTML = lines.slice(0, 40).map(line => {
        const parts = line.split('|');
        const type = parts[1]?.trim() ?? '';
        let cls = 'feed-item';
        if (type === 'message') cls += ' message';
        else if (type === 'peer_join') cls += ' join';
        else if (type === 'peer_leave' || type === 'peer_timeout') cls += ' leave';

        const time = parts[0] ? new Date(parts[0]).toLocaleTimeString() : '';
        const desc = parts.slice(1).map(p => p.trim()).filter(Boolean).join(' · ');
        return `<div class="${cls}">
          <span class="feed-time">${time}</span>
          <span class="feed-desc">${desc}</span>
        </div>`;
      }).join('');
    }

    function updateStats(data) {
      const total = data.total ?? 0;
      const working = data.working ?? 0;
      const waiting = data.waiting ?? 0;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-working').textContent = working;
      document.getElementById('stat-waiting').textContent = waiting;
      document.getElementById('last-update').textContent = new Date().toLocaleTimeString();

      const pct = v => total > 0 ? Math.round((v / total) * 100) : 0;
      document.getElementById('bar-total').style.width = total > 0 ? '100%' : '0%';
      document.getElementById('bar-working').style.width = pct(working) + '%';
      document.getElementById('bar-waiting').style.width = pct(waiting) + '%';
    }

    async function fetchConnections() {
      try {
        const res = await fetch('/api/connections');
        const pairs = await res.json();
        if (!cy) return;
        // Agregar edges nuevos
        for (const { a, b } of pairs) {
          const edgeId = [a, b].sort().join('--');
          if (!cy.$(`#${edgeId}`).length && cy.$(`#${a}`).length && cy.$(`#${b}`).length) {
            cy.add({ data: { id: edgeId, source: a, target: b } });
          }
        }
        // Eliminar edges que ya no tienen peers activos
        cy.edges().forEach(e => {
          const active = pairs.some(p => {
            const key = [p.a, p.b].sort().join('--');
            return key === e.id();
          });
          if (!active) cy.remove(e);
        });
      } catch {}
    }

    async function fetchActivity() {
      try {
        const res = await fetch('/api/activity?limit=40');
        const lines = await res.json();
        renderActivity(lines);
      } catch {}
    }

    async function fetchPeers() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        updateStats(data);
        updateGraph(data.peers ?? []);
        renderPeerCards(data.peers ?? []);
        lastPeers = data.peers ?? [];
      } catch {}
    }

    function connectSSE() {
      const es = new EventSource('/api/stream');
      es.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          updateStats(data);
          updateGraph(data.peers ?? []);
          renderPeerCards(data.peers ?? []);
          lastPeers = data.peers ?? [];
        } catch {}
      };
      es.onerror = () => { es.close(); setTimeout(connectSSE, 3000); };
    }

    document.addEventListener('DOMContentLoaded', () => {
      initGraph();
      // Esperar un tick para que el CSS aplique el height antes de que Cytoscape mida el contenedor
      requestAnimationFrame(() => {
        cy.resize();
        fetchPeers();
        fetchConnections();
        fetchActivity();
        connectSSE();
      });
      setInterval(fetchPeers, 2000);
      setInterval(fetchConnections, 3000);
      setInterval(fetchActivity, 2000);
    });
  </script>
</body>
</html>
