<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Peers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
  <style>
    :root {
      --status-working:  #10b981;
      --status-waiting:  #f59e0b;
      --status-idle:     #6b7280;
      --status-dead:     #ef4444;
      --bg-main:         #0f172a;
      --bg-card:         #1e293b;
      --bg-hover:        #334155;
      --text-primary:    #f1f5f9;
      --text-secondary:  #94a3b8;
      --text-muted:      #64748b;
    }
    body { background: var(--bg-main); color: var(--text-primary); font-family: 'SF Mono', 'Fira Code', monospace; margin: 0; }
    #graph { width: 100%; height: 300px; background: var(--bg-card); border-radius: 8px; }
    .peer-card { background: var(--bg-card); border-radius: 8px; padding: 16px; border: 1px solid #334155; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-working { background: var(--status-working); }
    .status-waiting { background: var(--status-waiting); animation: pulse 1s infinite; }
    .status-idle { background: var(--status-idle); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .feed-line { font-size: 11px; padding: 3px 8px; border-left: 2px solid #334155; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-line.message { border-color: #3b82f6; }
    .feed-line.join { border-color: var(--status-working); }
    .feed-line.leave { border-color: var(--status-dead); }
    .copy-btn { cursor: pointer; opacity: 0.6; font-size: 10px; padding: 2px 6px; border: 1px solid #334155; border-radius: 4px; }
    .copy-btn:hover { opacity: 1; }
    #no-peers { display: none; }
  </style>
</head>
<body>
  <div class="min-h-screen p-4">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <div>
        <h1 class="text-xl font-bold tracking-widest" style="color: #60a5fa">CLAUDE-PEERS</h1>
        <div class="text-xs" style="color: var(--text-muted)">Dashboard · <span id="last-update">actualizando...</span></div>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-green-500" style="animation: pulse 2s infinite"></div>
        <span class="text-xs" style="color: var(--text-muted)">2s</span>
      </div>
    </div>

    <!-- Stats -->
    <div id="stats-bar" class="grid grid-cols-3 gap-3 mb-4">
      <div class="peer-card text-center">
        <div id="stat-total" class="text-2xl font-bold text-green-400">0</div>
        <div class="text-xs" style="color: var(--text-muted)">activos</div>
      </div>
      <div class="peer-card text-center">
        <div id="stat-working" class="text-2xl font-bold text-blue-400">0</div>
        <div class="text-xs" style="color: var(--text-muted)">trabajando</div>
      </div>
      <div class="peer-card text-center">
        <div id="stat-waiting" class="text-2xl font-bold text-yellow-400">0</div>
        <div class="text-xs" style="color: var(--text-muted)">esperando</div>
      </div>
    </div>

    <!-- Main grid: grafo + feed -->
    <div class="grid grid-cols-3 gap-4 mb-4">
      <!-- Grafo -->
      <div class="col-span-2">
        <div class="text-xs mb-2" style="color: var(--text-muted)">RED DE PEERS</div>
        <div id="graph"></div>
        <div id="no-peers" class="text-center py-8" style="color: var(--text-muted)">
          Sin peers activos · Abre Claude Code en otro directorio
        </div>
      </div>

      <!-- Activity feed -->
      <div>
        <div class="text-xs mb-2" style="color: var(--text-muted)">ACTIVIDAD RECIENTE</div>
        <div id="activity-feed" class="overflow-y-auto space-y-1" style="height: 300px; background: var(--bg-card); border-radius: 8px; padding: 8px;"></div>
      </div>
    </div>

    <!-- Peer cards -->
    <div class="text-xs mb-2" style="color: var(--text-muted)">PEERS</div>
    <div id="peer-cards" class="grid gap-3" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr))"></div>
  </div>

  <script>
    const AGENT_COLORS = {
      'claude-code':  '#f97316',  // naranja
      'gemini-cli':   '#3b82f6',  // azul
      'opencode':     '#8b5cf6',  // violeta
      'copilot':      '#22c55e',  // verde
      'codex':        '#ec4899',  // rosa
      'unknown':      '#64748b',  // gris
    };

    const AGENT_LABELS = {
      'claude-code':  'CC',
      'gemini-cli':   'GM',
      'opencode':     'OC',
      'copilot':      'CP',
      'codex':        'CX',
      'unknown':      '?',
    };

    const AGENT_ICONS = {
      'claude-code': '/icons/claude-code.ico',
      'gemini-cli':  '/icons/gemini-cli.ico',
      'opencode':    '/icons/opencode.png',
      'copilot':     '/icons/copilot.jpg',
      'codex':       '/icons/codex.png',
    };

    let cy = null;
    let lastPeers = [];

    function initGraph() {
      cy = cytoscape({
        container: document.getElementById('graph'),
        style: [
          {
            selector: 'node',
            style: {
              'background-color': 'data(color)',
              'background-image': 'data(icon)',
              'background-fit': 'cover',
              'background-clip': 'node',
              'label': 'data(label)',
              'color': '#ffffff',
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': 6,
              'font-size': '10px',
              'font-weight': 'bold',
              'font-family': 'monospace',
              'width': 56,
              'height': 56,
              'border-width': 3,
              'border-color': '#334155',
              'text-wrap': 'wrap',
              'text-max-width': '80px',
            }
          },
          {
            selector: 'node[status = "working"]',
            style: { 'border-color': '#10b981' }
          },
          {
            selector: 'node[status = "waiting"]',
            style: { 'border-color': '#f59e0b' }
          },
          {
            selector: 'edge',
            style: {
              'width': 2,
              'line-color': '#3b82f6',
              'target-arrow-color': '#3b82f6',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          }
        ],
        layout: { name: 'grid' },
        userZoomingEnabled: true,
        userPanningEnabled: true,
      });
    }

    function updateGraph(peers) {
      if (!cy) return;

      const currentIds = new Set(peers.map(p => p.id));
      const graphIds = new Set(cy.nodes().map(n => n.id()));

      // Eliminar nodos que ya no están
      cy.nodes().forEach(n => {
        if (!currentIds.has(n.id())) cy.remove(n);
      });

      // Agregar/actualizar nodos
      for (const peer of peers) {
        const label = peer.role;
        const color = AGENT_COLORS[peer.agent] ?? '#64748b';
        const icon = AGENT_ICONS[peer.agent] ?? '';
        if (graphIds.has(peer.id)) {
          cy.$(`#${peer.id}`).data({ label, status: peer.status, color, icon });
        } else {
          cy.add({ data: { id: peer.id, label, status: peer.status, color, icon } });
        }
      }

      cy.layout({ name: 'grid', rows: 2 }).run();
    }

    function renderPeerCards(peers) {
      const container = document.getElementById('peer-cards');
      if (peers.length === 0) {
        container.innerHTML = '';
        document.getElementById('no-peers').style.display = 'block';
        return;
      }
      document.getElementById('no-peers').style.display = 'none';

      container.innerHTML = peers.map(peer => {
        const color = AGENT_COLORS[peer.agent] ?? '#64748b';
        const statusClass = `status-${peer.status}`;
        return `
          <div class="peer-card">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <div style="background:${color};width:28px;height:28px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                  ${AGENT_ICONS[peer.agent]
                    ? `<img src="${AGENT_ICONS[peer.agent]}" style="width:100%;height:100%;object-fit:cover" />`
                    : `<span style="color:#fff;font-size:11px;font-weight:bold;font-family:monospace">${AGENT_LABELS[peer.agent] ?? '?'}</span>`}
                </div>
                <span class="font-semibold text-sm">${peer.role}</span>
              </div>
              <span class="status-dot ${statusClass}"></span>
            </div>
            <div class="text-xs space-y-1" style="color: var(--text-secondary)">
              <div>📁 ${peer.path}</div>
              <div>🤖 ${peer.agent} ${peer.agent_version !== 'unknown' ? peer.agent_version : ''}</div>
              ${peer.current_task ? `<div style="color: var(--text-primary)">💬 ${peer.current_task}</div>` : ''}
              <div class="flex items-center gap-2 mt-2">
                <span style="color: var(--text-muted); font-size: 10px">${peer.id}</span>
                <button class="copy-btn" onclick="navigator.clipboard.writeText('${peer.id}')">📋</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderActivity(lines) {
      const feed = document.getElementById('activity-feed');
      feed.innerHTML = lines.slice(0, 30).map(line => {
        const parts = line.split('|');
        const type = parts[1] ?? '';
        let cssClass = 'feed-line';
        if (type === 'message') cssClass += ' message';
        else if (type === 'peer_join') cssClass += ' join';
        else if (type === 'peer_leave' || type === 'peer_timeout') cssClass += ' leave';

        const time = parts[0] ? new Date(parts[0]).toLocaleTimeString() : '';
        const rest = parts.slice(1).join(' · ');
        return `<div class="${cssClass}"><span style="color: var(--text-muted)">${time}</span> ${rest}</div>`;
      }).join('');
    }

    function updateStats(data) {
      document.getElementById('stat-total').textContent = data.total ?? 0;
      document.getElementById('stat-working').textContent = data.working ?? 0;
      document.getElementById('stat-waiting').textContent = data.waiting ?? 0;
      document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
    }

    async function fetchActivity() {
      try {
        const res = await fetch('/api/activity?limit=30');
        const lines = await res.json();
        renderActivity(lines);
      } catch {}
    }

    async function fetchPeers() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        updateStats(data);
        updateGraph(data.peers ?? []);
        renderPeerCards(data.peers ?? []);
        lastPeers = data.peers ?? [];
      } catch {}
    }

    // SSE para updates de peers (con fallback a polling)
    function connectSSE() {
      const es = new EventSource('/api/stream');
      es.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          updateStats(data);
          updateGraph(data.peers ?? []);
          renderPeerCards(data.peers ?? []);
          lastPeers = data.peers ?? [];
        } catch {}
      };
      es.onerror = () => {
        es.close();
        setTimeout(connectSSE, 3000);
      };
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      initGraph();
      fetchPeers(); // carga inmediata via polling
      connectSSE();
      fetchActivity();
      setInterval(fetchPeers, 2000);    // polling de respaldo
      setInterval(fetchActivity, 2000);
    });
  </script>
</body>
</html>
