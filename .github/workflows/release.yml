name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: agents-mesh-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            artifact: agents-mesh-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: agents-mesh-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: agents-mesh-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build standalone binary
        run: |
          bun build src/cli/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile=${{ matrix.artifact }}

      - name: Package
        run: |
          tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256

  update-formula:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agents-mesh-darwin-arm64

      - uses: actions/download-artifact@v4
        with:
          name: agents-mesh-darwin-x64

      - name: Update Formula with new SHAs
        run: |
          ARM64_SHA=$(cat agents-mesh-darwin-arm64.tar.gz.sha256 | awk '{print $1}')
          X64_SHA=$(cat agents-mesh-darwin-x64.tar.gz.sha256 | awk '{print $1}')
          VERSION=${GITHUB_REF_NAME#v}

          sed -i \
            -e "s|__VERSION__|${VERSION}|g" \
            -e "s|__ARM64_SHA__|${ARM64_SHA}|g" \
            -e "s|__X64_SHA__|${X64_SHA}|g" \
            Formula/agents-mesh.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agents-mesh.rb
          git commit -m "chore: update formula for ${GITHUB_REF_NAME}" || true
          git push origin HEAD:main || true
